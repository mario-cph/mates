<!doctype html><html><head><meta charset="utf-8"><title>Tema 1 · 2.º ESO</title></head><body><script>(async()=>{const b=await(await fetch('tema01.data')).text();const u=Uint8Array.from(atob(b.trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const t=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(t);document.close()})().catch(e=>document.body.innerHTML='<p>Error al cargar la presentación.</p>')</script></body></html>
