<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tema 4 · Ecuaciones e inecuaciones · 4.º ESO</title><style>
:root{--navy:#172c59;--blue:#2676d8;--purple:#7655bd;--ink:#20304a;--green:#177d52}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:Arial,'Segoe UI',sans-serif;color:var(--ink)}body{background:linear-gradient(125deg,#eaf4ff 0%,#f8fbff 55%,#fff 100%)}#stage{height:calc(100vh - 92px);height:calc(100dvh - 92px);padding:18px 3.1vw 10px;overflow:hidden;display:flex;flex-direction:column}.slideHead{display:flex;align-items:baseline;justify-content:space-between;gap:20px}.slideHead h2{font-size:clamp(25px,2.65vw,43px);color:var(--navy);margin:0 0 14px}.sub{font-size:15px;color:#6c7692;white-space:nowrap}.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:13px;align-items:stretch}.card{background:white;border-radius:17px;box-shadow:0 5px 18px #284e7714;border-top:5px solid #488be0;padding:17px 21px;font-size:clamp(19px,1.65vw,28px);line-height:1.48;overflow-wrap:anywhere}.card h3{font-size:clamp(21px,1.75vw,29px);color:#1c57a3;margin:0 0 9px}.card .solution{color:#086c46}.yellow{background:#fff6d6;border-left:6px solid #e6b736;border-radius:8px;padding:10px 15px;margin:8px 0}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.1;font-size:.91em;margin:0 .12em;white-space:nowrap}.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 .14em .12em}.frac>span:last-child{padding:.12em .14em 0}.steps{display:flex;flex-direction:column;gap:9px;max-height:100%;overflow:hidden}.step{background:#fff;border-left:5px solid #5b83d8;border-radius:11px;padding:9px 16px;font-size:clamp(19px,1.65vw,27px);line-height:1.4;animation:appear .2s ease}.step:last-child{border-left-color:#209264;background:#effaf4}@keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}.hero{text-align:center;padding:25px}.hero h1{font-size:clamp(45px,6vw,90px);margin:8px;color:var(--navy)}.hero h2{font-size:clamp(30px,3.8vw,60px);margin:10px;color:#395fbb}.hero p{font-size:clamp(20px,2vw,30px)}.eyebrow{font-size:22px;letter-spacing:3px;font-weight:800;color:#4564a6}.pill{display:inline-block;padding:11px 23px;border-radius:25px;background:#f3eac8;color:#594b2a}.sessionNo{font-size:clamp(120px,19vw,280px);font-weight:800;min-width:30%;text-align:center;color:#fff;background:linear-gradient(135deg,#327fe0,#7b56b9);border-radius:24px}.body.session{display:flex;flex-direction:row;align-items:center;gap:4vw}.sessionCopy h2{font-size:clamp(36px,4.6vw,68px);color:var(--navy)}.sessionCopy p{font-size:clamp(23px,2.4vw,34px)}.longdiv{display:flex;font-size:clamp(17px,1.6vw,25px);line-height:1.55;white-space:nowrap}.dividend{padding:4px 14px}.divisor{border-left:3px solid var(--ink);border-bottom:0;padding:5px 13px}.divisor .q{display:block;border-top:3px solid var(--ink);color:#146da0}.dim{color:#73819a}.ruff{display:flex;justify-content:flex-start;font-size:clamp(22px,2vw,31px);font-variant-numeric:tabular-nums}.rv{border-right:3px solid #243c68;padding:29px 14px 5px}.rr{padding-left:13px}.rrow{padding:5px 12px;white-space:pre}.rrow:last-child{border-top:3px solid #243c68}.footer{position:fixed;bottom:0;left:0;right:0;height:92px;display:flex;align-items:center;padding:0 19px;background:transparent;z-index:50;gap:10px}.controls{display:flex;gap:9px;align-items:center}.left{margin-right:auto}.right{margin-left:auto}.footer.swapped .right{order:-1;margin-left:0;margin-right:auto}.footer.swapped .left{order:2;margin-right:0;margin-left:auto}.footer.swapped .middle{order:1}.middle{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px}.counter{font-size:20px;font-weight:bold;color:#1d417b;white-space:nowrap}.btn{width:52px;height:52px;border:0;border-radius:13px;background:#2c73c7;color:white;font-size:28px;font-weight:bold;cursor:pointer;box-shadow:0 4px 11px #183b6d2b}.btn:disabled{opacity:.28;cursor:default}.btn.menu{background:#19335f}.btn.swap{background:#7161aa;font-size:22px;width:43px;height:43px}.progress{position:fixed;bottom:0;left:0;height:5px;background:linear-gradient(90deg,#1886e7,#8055c4);transition:width .2s;z-index:70}.overlay{position:fixed;inset:0;background:#0c1b3b;z-index:100;color:#fff;padding:28px 5vw;display:none;overflow:auto}.overlay.show{display:block}.overlay h2{font-size:35px}.indexGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:13px}.indexItem{background:#1b386e;border:1px solid #5074ac;color:#fff;border-radius:13px;text-align:left;padding:17px;font-size:20px;cursor:pointer}.close{float:right;background:#c83e47;color:#fff;border:0;border-radius:10px;padding:14px 20px;font-size:20px;cursor:pointer}.jump{margin-top:22px;font-size:20px}.jump input{width:90px;font-size:23px}.jump button{font-size:20px}.stepPlaceholder{color:#627ba4;font-size:19px;font-style:italic}@media(max-width:850px){#stage{height:calc(100vh - 120px);height:calc(100dvh - 120px);padding:10px 14px}.footer{height:120px}.btn{width:44px;height:44px;font-size:23px}.controls{gap:4px}.card{padding:12px;font-size:18px}.card h3{font-size:21px}.slideHead h2{font-size:26px}.sessionNo{font-size:95px}.middle{bottom:73px}.counter{font-size:15px}}@media(max-height:720px){#stage{padding-top:8px}.card{padding:9px 14px;font-size:clamp(17px,1.45vw,23px)}.card h3{font-size:clamp(18px,1.5vw,25px)}.steps{gap:5px}.step{padding:6px 13px;font-size:clamp(17px,1.45vw,23px)}}
.idxCode{display:block;color:#2a70ca;font-size:15px;font-weight:800}.idxTitle{display:block;color:#182e57;font-size:19px;font-weight:700;margin-top:3px}.formulaBig{font-size:clamp(36px,4.2vw,64px);color:#1559b1;font-weight:800;text-align:center;padding:14px;background:#eaf3ff;border:3px solid #a5c5f7;border-radius:14px}.body:has(.steps){justify-content:flex-start}.body:has(.steps) .cards{flex:0 0 auto}.body:has(.steps) .card{padding:11px 18px}.body:has(.steps) .step{font-size:clamp(18px,1.48vw,24px);padding:7px 13px}.body:has(.steps) .steps{gap:6px}.body:has(.steps) .stepPlaceholder{font-size:19px}.body:has(.steps) .cards .card{font-size:clamp(21px,2vw,30px)}.body:has(.cards){justify-content:flex-start}.body .cards{align-content:start}</style></head><body><main id="stage"><header class="slideHead"><h2 id="title"></h2><span class="sub" id="sub"></span></header><section id="body" class="body"></section></main><footer id="footer" class="footer"><div class="controls left"><button id="menu" class="btn menu" title="Índice" aria-label="Índice">☰</button><button id="full" class="btn menu" title="Pantalla completa" aria-label="Pantalla completa">⛶</button></div><div class="middle"><span id="counter" class="counter"></span><button id="swap" class="btn swap" title="Intercambiar controles" aria-label="Intercambiar controles">⇄</button></div><div class="controls right"><button id="prev" class="btn" title="Diapositiva anterior" aria-label="Anterior">◀</button><button id="back" class="btn" title="Paso anterior" aria-label="Paso anterior">↶</button><button id="nextStep" class="btn" title="Paso siguiente" aria-label="Paso siguiente">↷</button><button id="reset" class="btn" title="Reiniciar pasos" aria-label="Reiniciar">↺</button><button id="next" class="btn" title="Diapositiva siguiente" aria-label="Siguiente">▶</button></div></footer><div id="progress" class="progress"></div><aside id="index" class="overlay"><button class="close" id="close">✕ Cerrar</button><h2>Índice del tema</h2><div id="indexGrid" class="indexGrid"></div><div class="jump">Ir a diapositiva <input id="jump" type="number" min="1"><button id="go">Ir</button><span id="err"></span></div></aside><script>const slides=[{"title": "Tema 4 · Ecuaciones e inecuaciones", "kind": "portada", "content": "<div class=\"hero\"><div class=\"eyebrow\">MATEMÁTICAS · 4.º ESO · OPCIÓN B<\/div><h1>Tema 4<\/h1><h2>Ecuaciones e inecuaciones<\/h2><p>8 sesiones de 45 minutos<\/p><div class=\"pill\">Presentación visual · Sin profesor virtual<\/div><\/div>", "steps": [], "session": 0}, {"title": "Mapa del tema", "kind": "mapa", "content": "<article class=\"card\"><h3>Sesiones 1 y 2<\/h3>Elementos de las ecuaciones · Primer grado · Segundo grado incompleto y completo.<\/article><article class=\"card\"><h3>Sesiones 3 y 4<\/h3>Discriminante y número de soluciones · Bicuadradas · Ecuaciones factorizadas.<\/article><article class=\"card\"><h3>Sesiones 5 y 6<\/h3>Ecuaciones racionales · Restricciones · Ecuaciones radicales · Comprobación.<\/article><article class=\"card\"><h3>Sesiones 7 y 8<\/h3>Inecuaciones de primer grado · Intervalos · Inecuaciones cuadráticas y estudio de signos.<\/article>", "steps": [], "session": 0}, {"title": "Sesión 1", "kind": "sesion", "content": "<div class=\"sessionNo\">1<\/div><div class=\"sessionCopy\"><div class=\"eyebrow\">SESIÓN 1 · 45 MINUTOS<\/div><h2>Ecuaciones y primer grado<\/h2><p>Elementos · Soluciones · Paréntesis y denominadores<\/p><\/div>", "steps": [], "session": 1}, {"title": "Elementos de una ecuación", "kind": "teoria", "content": "<article class=\"card\"><h3>Partes<\/h3>Una <b>ecuación<\/b> es una igualdad con incógnitas. En <b>3(x−2)+5=2x+1<\/b>, la incógnita es <b>x<\/b>; cada lado es un <b>miembro<\/b>.<\/article><article class=\"card\"><h3>Términos y grado<\/h3>Los términos son los sumandos de cada miembro. El <b>grado<\/b> es el mayor exponente de la incógnita después de simplificar.<\/article><article class=\"card\"><h3>Solución<\/h3>Es un valor que hace verdadera la igualdad. Se comprueba sustituyendo en <b>ambos miembros<\/b>.<\/article>", "steps": [], "session": 1}, {"title": "Comprobar una solución", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3>¿Es x=2 solución de 3(x−2)+5=2x+1?<\/article>", "steps": ["Sustituimos x por 2 en el primer miembro: 3(2−2)+5=5.", "Sustituimos x por 2 en el segundo miembro: 2·2+1=5.", "Como 5=5, <b>x=2 sí es solución<\/b>."], "session": 1}, {"title": "Primer grado · Paréntesis", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3>4(x−2)=6x<\/article>", "steps": ["Aplicamos la distributiva: 4x−8=6x.", "Agrupamos incógnitas: 4x−6x=8.", "Simplificamos: −2x=8.", "Dividimos por −2: <b>x=−4<\/b>."], "session": 1}, {"title": "Primer grado · Denominadores", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3><span class=\"frac\"><span>x−1<\/span><span>2<\/span><\/span>+<span class=\"frac\"><span>x+2<\/span><span>3<\/span><\/span>=4<\/article>", "steps": ["El mínimo común múltiplo de 2 y 3 es 6.", "Multiplicamos todos los términos por 6: 3(x−1)+2(x+2)=24.", "Quitamos paréntesis: 3x−3+2x+4=24.", "Agrupamos: 5x+1=24; 5x=23.", "Resultado: <b>x=<span class=\"frac\"><span>23<\/span><span>5<\/span><\/span><\/b>."], "session": 1}, {"title": "Sesión 1 · Ejercicios", "kind": "ejercicios", "content": "<article class=\"card\"><h3>Ejercicio 1<\/h3>Indica incógnita, miembros y grado: a) (x+2)−(x−5)+2=7−x<sup>2<\/sup>. b) x+(x−1)−9=x+4.<\/article><article class=\"card\"><h3>Ejercicio 3<\/h3>Comprueba si x=3 y x=−3 son soluciones de: a) 3x−2=7. b) x<sup>2<\/sup>−9=0.<\/article>", "steps": [], "session": 1}, {"title": "Sesión 2", "kind": "sesion", "content": "<div class=\"sessionNo\">2<\/div><div class=\"sessionCopy\"><div class=\"eyebrow\">SESIÓN 2 · 45 MINUTOS<\/div><h2>Ecuaciones de segundo grado<\/h2><p>Incompletas · Fórmula general<\/p><\/div>", "steps": [], "session": 2}, {"title": "Ecuación cuadrática", "kind": "teoria", "content": "<article class=\"card\"><h3>Forma general<\/h3><b>ax<sup>2<\/sup>+bx+c=0<\/b>, con a≠0.<\/article><article class=\"card\"><h3>Incompleta<\/h3>Falta b, falta c o faltan ambos. Conviene resolverlas sin fórmula cuando sea posible.<\/article><article class=\"card\"><h3>Completa<\/h3>Tiene los tres términos; la fórmula general permite calcular las soluciones reales.<\/article>", "steps": [], "session": 2}, {"title": "Incompleta · Sin término lineal", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3>2x<sup>2<\/sup>−32=0<\/article>", "steps": ["Aislamos: 2x²=32.", "Dividimos: x²=16.", "Extraemos las dos raíces: <b>x=4 y x=−4<\/b>."], "session": 2}, {"title": "Incompleta · Sin término independiente", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3>3x<sup>2<\/sup>−12x=0<\/article>", "steps": ["Sacamos factor común: 3x(x−4)=0.", "Producto nulo: 3x=0 o x−4=0.", "Soluciones: <b>x=0 y x=4<\/b>."], "session": 2}, {"title": "Incompleta · Solo término cuadrático", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3>2x<sup>2<\/sup>=0<\/article>", "steps": ["Dividimos entre 2: x²=0.", "Única solución: <b>x=0<\/b> (raíz doble)."], "session": 2}, {"title": "Fórmula de segundo grado", "kind": "teoria", "content": "<article class=\"card\"><h3>Fórmula general<\/h3><div class=\"formulaBig\">x = <span class=\"frac\"><span>−b ± √(b²−4ac)<\/span><span>2a<\/span><\/span><\/div><\/article><article class=\"card\"><h3>Discriminante<\/h3><b>Δ=b²−4ac<\/b>. Su signo determina cuántas soluciones reales existen.<\/article>", "steps": [], "session": 2}, {"title": "Ecuación completa · Fórmula", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3>x<sup>2<\/sup>+7x+12=0<\/article>", "steps": ["Identificamos: a=1, b=7, c=12.", "Calculamos Δ=7²−4·1·12=49−48=1.", "Aplicamos la fórmula: x=<span class=\"frac\"><span>−7±√1<\/span><span>2<\/span><\/span>.", "Las dos soluciones son <b>x=−3 y x=−4<\/b>."], "session": 2}, {"title": "Sesión 2 · Ejercicios", "kind": "ejercicios", "content": "<article class=\"card\"><h3>Ejercicio 5<\/h3>Resuelve: a) 4(x−2)=6x. b) x²+7x+12=0. c) 5x²+10x+7=0.<\/article><article class=\"card\"><h3>Ejercicio 8<\/h3>Resuelve: a) 7x²−12=0. b) 2x²−32=0. c) 2x²=0.<\/article>", "steps": [], "session": 2}, {"title": "Sesión 3", "kind": "sesion", "content": "<div class=\"sessionNo\">3<\/div><div class=\"sessionCopy\"><div class=\"eyebrow\">SESIÓN 3 · 45 MINUTOS<\/div><h2>Número de soluciones<\/h2><p>Discriminante · Interpretación de las raíces<\/p><\/div>", "steps": [], "session": 3}, {"title": "Tres posibilidades", "kind": "teoria", "content": "<article class=\"card\"><h3>Δ &gt; 0<\/h3>Dos soluciones reales distintas. Ejemplo: x²−5x+6=0 → x=2 y x=3.<\/article><article class=\"card\"><h3>Δ = 0<\/h3>Una solución real doble. Ejemplo: x²−6x+9=0 → x=3.<\/article><article class=\"card\"><h3>Δ &lt; 0<\/h3>Ninguna solución real. Ejemplo: x²+4x+5=0 → Δ=−4.<\/article>", "steps": [], "session": 3}, {"title": "Estudiar las soluciones", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3>x<sup>2<\/sup>−10x+25=0<\/article>", "steps": ["a=1, b=−10, c=25.", "Δ=(−10)²−4·1·25=100−100=0.", "Hay <b>una solución real doble<\/b>: x=5."], "session": 3}, {"title": "Un parámetro en el discriminante", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3>kx<sup>2<\/sup>−2x+2=0 · ¿Cuándo hay dos raíces reales?<\/article>", "steps": ["Para k≠0 es cuadrática: a=k, b=−2, c=2.", "Δ=4−8k. Para dos raíces distintas: 4−8k&gt;0.", "Por tanto <b>k&lt;1/2 y k≠0<\/b>. Si k=0, la ecuación pasa a ser de primer grado."], "session": 3}, {"title": "Sesión 3 · Ejercicios", "kind": "ejercicios", "content": "<article class=\"card\"><h3>Ejercicio 9<\/h3>Determina el número de soluciones reales: a) x²−10x+25=0. b) x²−5x+8=0.<\/article><article class=\"card\"><h3>Ejercicio 11<\/h3>Escribe dos ecuaciones distintas de segundo grado cuya única solución real sea −2.<\/article>", "steps": [], "session": 3}, {"title": "Sesión 4", "kind": "sesion", "content": "<div class=\"sessionNo\">4<\/div><div class=\"sessionCopy\"><div class=\"eyebrow\">SESIÓN 4 · 45 MINUTOS<\/div><h2>Bicuadradas y factorizadas<\/h2><p>Cambio de variable · Producto nulo<\/p><\/div>", "steps": [], "session": 4}, {"title": "¿Qué es una bicuadrada?", "kind": "teoria", "content": "<article class=\"card\"><h3>Definición<\/h3>Tiene forma <b>ax<sup>4<\/sup>+bx<sup>2<\/sup>+c=0<\/b>. No contiene potencias impares.<\/article><article class=\"card\"><h3>Cambio de variable<\/h3>Ponemos <b>t=x²<\/b> y por tanto <b>x⁴=t²<\/b>. Resolvemos una cuadrática en t.<\/article><article class=\"card\"><h3>Volver a x<\/h3>Solo los valores t≥0 dan soluciones reales: x=±√t.<\/article>", "steps": [], "session": 4}, {"title": "Bicuadrada · Dos soluciones", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3>x<sup>4<\/sup>+4x<sup>2<\/sup>−5=0<\/article>", "steps": ["Sustituimos t=x²: t²+4t−5=0.", "Factorizamos: (t+5)(t−1)=0.", "Obtenemos t=−5 o t=1.", "Descartamos t=−5, porque x² no puede ser negativo.", "De t=1: <b>x=−1 y x=1<\/b>."], "session": 4}, {"title": "Bicuadrada · Cuatro soluciones", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3>x<sup>4<\/sup>−5x<sup>2<\/sup>+4=0<\/article>", "steps": ["Cambio t=x²: t²−5t+4=0.", "Factorizamos: (t−1)(t−4)=0.", "t=1 o t=4: ambos son no negativos.", "Volvemos a x: <b>x=±1 y x=±2<\/b>."], "session": 4}, {"title": "Ecuaciones factorizadas", "kind": "teoria", "content": "<article class=\"card\"><h3>Producto nulo<\/h3>Si <b>A·B=0<\/b>, al menos uno de los factores vale cero.<\/article><article class=\"card\"><h3>Atención<\/h3>La propiedad solo se aplica cuando la expresión está igualada a cero.<\/article>", "steps": [], "session": 4}, {"title": "Resolver por factorización", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3>(x+1)(x−7)(x+4)=0<\/article>", "steps": ["Igualamos cada factor a cero: x+1=0, x−7=0 o x+4=0.", "Resolvemos: <b>x=−1, x=7, x=−4<\/b>.", "Comprobación: en cada solución, uno de los factores es cero."], "session": 4}, {"title": "Sesión 4 · Ejercicios", "kind": "ejercicios", "content": "<article class=\"card\"><h3>Ejercicio 16<\/h3>Resuelve las bicuadradas: a) x⁴+4x²−5=0. b) x⁴−2x²=8.<\/article><article class=\"card\"><h3>Ejercicio 20<\/h3>Resuelve: a) (x+1)(x−7)(x+4)=0. b) (x−3)(x²+2x+1)(x²+5)=0.<\/article>", "steps": [], "session": 4}, {"title": "Sesión 5", "kind": "sesion", "content": "<div class=\"sessionNo\">5<\/div><div class=\"sessionCopy\"><div class=\"eyebrow\">SESIÓN 5 · 45 MINUTOS<\/div><h2>Ecuaciones racionales<\/h2><p>Denominadores con incógnita · Restricciones<\/p><\/div>", "steps": [], "session": 5}, {"title": "Ecuaciones racionales", "kind": "teoria", "content": "<article class=\"card\"><h3>Definición<\/h3>Contienen una fracción algebraica con la incógnita en algún denominador.<\/article><article class=\"card\"><h3>Restricciones<\/h3>Los denominadores <b>nunca pueden valer cero<\/b>. Hay que escribir los valores prohibidos antes de operar.<\/article><article class=\"card\"><h3>Método<\/h3>Hallamos denominador común, eliminamos denominadores, resolvemos y <b>comprobamos<\/b> las soluciones.<\/article>", "steps": [], "session": 5}, {"title": "Racional · Una fracción", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3><span class=\"frac\"><span>x+2<\/span><span>x−1<\/span><\/span>=3<\/article>", "steps": ["Restricción: x−1≠0; por tanto x≠1.", "Multiplicamos por x−1: x+2=3(x−1).", "Desarrollamos: x+2=3x−3.", "Despejamos: 5=2x → x=<span class=\"frac\"><span>5<\/span><span>2<\/span><\/span>.", "La solución no es 1: <b>válida<\/b>."], "session": 5}, {"title": "Racional · Dos denominadores", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3><span class=\"frac\"><span>2<\/span><span>x<\/span><\/span>+<span class=\"frac\"><span>1<\/span><span>x+1<\/span><\/span>=1<\/article>", "steps": ["Restricciones: x≠0 y x≠−1.", "Multiplicamos por x(x+1): 2(x+1)+x=x(x+1).", "Ordenamos: x²−2x−2=0.", "Fórmula: x=<span class=\"frac\"><span>2±√12<\/span><span>2<\/span><\/span>=1±√3.", "Ninguna raíz es 0 ni −1: <b>ambas válidas<\/b>."], "session": 5}, {"title": "Sesión 5 · Ejercicios", "kind": "ejercicios", "content": "<article class=\"card\"><h3>Ejercicio 24<\/h3>Resuelve las ecuaciones racionales: a) <span class=\"frac\"><span>x<\/span><span>x−2<\/span><\/span>=<span class=\"frac\"><span>2<\/span><span>x−2<\/span><\/span>. b) <span class=\"frac\"><span>x+1<\/span><span>x<\/span><\/span>=2.<\/article><article class=\"card\"><h3>Ejercicio 25<\/h3>Resuelve: a) <span class=\"frac\"><span>1<\/span><span>x<\/span><\/span>+<span class=\"frac\"><span>2<\/span><span>x<\/span><\/span>=3.<\/article>", "steps": [], "session": 5}, {"title": "Sesión 6", "kind": "sesion", "content": "<div class=\"sessionNo\">6<\/div><div class=\"sessionCopy\"><div class=\"eyebrow\">SESIÓN 6 · 45 MINUTOS<\/div><h2>Ecuaciones radicales<\/h2><p>Aislar la raíz · Elevar al cuadrado · Comprobar<\/p><\/div>", "steps": [], "session": 6}, {"title": "Ecuaciones radicales", "kind": "teoria", "content": "<article class=\"card\"><h3>Definición<\/h3>La incógnita aparece dentro de un radical: √(x+9)=x−3.<\/article><article class=\"card\"><h3>Procedimiento<\/h3>Aislamos un radical y elevamos al cuadrado ambos miembros. Repetimos si hace falta.<\/article><article class=\"card\"><h3>Precaución<\/h3>Elevar al cuadrado puede producir <b>soluciones extrañas<\/b>. Hay que sustituir en la ecuación original.<\/article>", "steps": [], "session": 6}, {"title": "Radical · Una raíz", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3>√(x+9)=x−3<\/article>", "steps": ["Condición: x−3≥0, así que x≥3.", "Elevamos al cuadrado: x+9=(x−3)².", "Desarrollamos: x+9=x²−6x+9 → x²−7x=0.", "Factorizamos: x(x−7)=0 → candidatos 0 y 7.", "x=0 incumple x≥3. Para x=7: √16=4 y 7−3=4. <b>x=7<\/b>."], "session": 6}, {"title": "Radical · Solución extraña", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3>√(x+5)=x−1<\/article>", "steps": ["Condición inicial: x≥1.", "Cuadramos: x+5=x²−2x+1.", "Ordenamos: x²−3x−4=0 → (x−4)(x+1)=0.", "Candidatos: x=4 y x=−1.", "x=4: √9=3=4−1. x=−1 no cumple. <b>Solo x=4<\/b>."], "session": 6}, {"title": "Sesión 6 · Ejercicios", "kind": "ejercicios", "content": "<article class=\"card\"><h3>Ejercicio 28<\/h3>Resuelve: b) √(x−4)=x−6.<\/article><article class=\"card\"><h3>Ejercicio 29<\/h3>Resuelve: a) √(3−2x)=√(5−x).<\/article>", "steps": [], "session": 6}, {"title": "Sesión 7", "kind": "sesion", "content": "<div class=\"sessionNo\">7<\/div><div class=\"sessionCopy\"><div class=\"eyebrow\">SESIÓN 7 · 45 MINUTOS<\/div><h2>Inecuaciones de primer grado<\/h2><p>Propiedades · Intervalos · Recta real<\/p><\/div>", "steps": [], "session": 7}, {"title": "Inecuaciones", "kind": "teoria", "content": "<article class=\"card\"><h3>Definición<\/h3>Una inecuación compara expresiones mediante &lt;, &gt;, ≤ o ≥. Su solución suele ser un <b>conjunto de números<\/b>.<\/article><article class=\"card\"><h3>Reglas<\/h3>Sumar o restar el mismo número conserva el signo. Multiplicar o dividir por un número <b>negativo invierte<\/b> el sentido de la desigualdad.<\/article><article class=\"card\"><h3>Intervalos<\/h3>x&gt;2 se escribe (2,+∞). x≤2 se escribe (−∞,2]. Los extremos incluidos se representan con punto cerrado.<\/article>", "steps": [], "session": 7}, {"title": "Primer grado · Cambio de sentido", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3>−2x&lt;2x−4<\/article>", "steps": ["Agrupamos: −2x−2x&lt;−4.", "Reducimos: −4x&lt;−4.", "Dividimos entre −4 e <b>invertimos<\/b> el signo: x&gt;1.", "Solución: <b>(1,+∞)<\/b>."], "session": 7}, {"title": "Primer grado · Otro ejemplo", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3>7−2x&lt;−4<\/article>", "steps": ["Restamos 7: −2x&lt;−11.", "Dividimos entre −2 e invertimos el signo.", "Solución: <b>x&gt;11/2<\/b>, intervalo (11/2,+∞)."], "session": 7}, {"title": "Sesión 7 · Ejercicios", "kind": "ejercicios", "content": "<article class=\"card\"><h3>Ejercicio 31<\/h3>Resuelve y expresa en intervalos: a) 2x−3x+5&gt;6x−1. b) −2x&lt;2x−4. e) 7−2x&lt;−4.<\/article><article class=\"card\"><h3>Ejercicio 33<\/h3>Escribe una inecuación cuya solución sea [2,+∞).<\/article>", "steps": [], "session": 7}, {"title": "Sesión 8", "kind": "sesion", "content": "<div class=\"sessionNo\">8<\/div><div class=\"sessionCopy\"><div class=\"eyebrow\">SESIÓN 8 · 45 MINUTOS<\/div><h2>Inecuaciones de segundo grado<\/h2><p>Raíces · Signos · Unión de intervalos<\/p><\/div>", "steps": [], "session": 8}, {"title": "Inecuaciones cuadráticas", "kind": "teoria", "content": "<article class=\"card\"><h3>Método<\/h3>1. Pasar todo a un miembro. 2. Hallar los ceros del polinomio. 3. Dividir la recta en intervalos. 4. Determinar el signo en cada intervalo.<\/article><article class=\"card\"><h3>Extremos<\/h3>Con &lt; o &gt; se excluyen las raíces. Con ≤ o ≥ se incluyen, siempre que la expresión esté definida.<\/article><article class=\"card\"><h3>Casos especiales<\/h3>Si no hay raíces reales, el signo no cambia. Si hay raíz doble, el signo tampoco cambia al cruzarla.<\/article>", "steps": [], "session": 8}, {"title": "Cuadrática · Entre las raíces", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3>x<sup>2<\/sup>−3x≤0<\/article>", "steps": ["Factorizamos: x(x−3)≤0.", "Ceros: x=0 y x=3. Intervalos: (−∞,0), (0,3), (3,+∞).", "Probamos x=−1: (+); x=1: (−); x=4: (+).", "Buscamos valores ≤0 e incluimos las raíces.", "Solución: <b>[0,3]<\/b>."], "session": 8}, {"title": "Cuadrática · Fuera de las raíces", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3>2x<sup>2<\/sup>−4x&gt;0<\/article>", "steps": ["Factorizamos: 2x(x−2)&gt;0.", "Ceros: x=0 y x=2.", "El producto es positivo para x&lt;0 y x&gt;2; negativo entre 0 y 2.", "Como es estricta, excluimos 0 y 2.", "Solución: <b>(−∞,0) ∪ (2,+∞)<\/b>."], "session": 8}, {"title": "Cuadrática · Raíz doble", "kind": "procedimiento", "content": "<article class=\"card\"><h3>Ejemplo guiado<\/h3>x<sup>2<\/sup>−2x+1&lt;0<\/article>", "steps": ["Reconocemos un cuadrado: (x−1)²&lt;0.", "Un cuadrado nunca es negativo.", "Solución: <b>∅ (conjunto vacío)<\/b>."], "session": 8}, {"title": "Sesión 8 · Ejercicios", "kind": "ejercicios", "content": "<article class=\"card\"><h3>Ejercicio 34<\/h3>Resuelve y expresa mediante intervalos: a) x²≤3x. b) 2x²&gt;4x. c) 3x²&lt;3.<\/article><article class=\"card\"><h3>Ejercicio 35<\/h3>Resuelve: a) x²−2x+1&lt;0. d) x²−8x+16≥0.<\/article>", "steps": [], "session": 8}, {"title": "Resumen del tema", "kind": "resumen", "content": "<article class=\"card\"><h3>Ecuaciones<\/h3>Primer grado · Segundo grado · Discriminante · Bicuadradas · Factorizadas.<\/article><article class=\"card\"><h3>Racionales y radicales<\/h3>Restricciones en denominadores · Elevar al cuadrado · Comprobar siempre los candidatos.<\/article><article class=\"card\"><h3>Inecuaciones<\/h3>Si dividimos por un negativo, invertimos el signo · Representar en intervalos · Estudiar signos de cuadráticas.<\/article>", "steps": [], "session": 0}, {"title": "Fin del tema", "kind": "fin", "content": "<div class=\"hero\"><h1>¡Tema completado!<\/h1><h2>Ecuaciones e inecuaciones<\/h2><p>Comprueba las soluciones y justifica siempre los intervalos.<\/p><\/div>", "steps": [], "session": 0}];let current=0,shown=0;const $=id=>document.getElementById(id);const index=$('index');function render(){let s=slides[current];$('title').textContent=s.title;$('sub').textContent=s.session?'4.º ESO · SESIÓN '+s.session:'4.º ESO · TEMA 4';$('body').className='body '+(s.kind==='sesion'?'session':'');let markup=(s.kind==='sesion'||s.kind==='portada'||s.kind==='fin')?s.content:'<div class="cards">'+s.content+'</div>';if(s.steps.length){markup+='<div class="steps" id="steps">'+s.steps.slice(0,shown).map((x,i)=>'<div class="step"><strong>'+String(i+1).padStart(2,'0')+'.</strong> '+x+'</div>').join('')+'</div>';if(!shown)markup+='<div class="stepPlaceholder">Pulsa ↷ para revelar el primer paso</div>'}$('body').innerHTML=markup;$('counter').textContent=(current+1)+' / '+slides.length;$('progress').style.width=(100*(current+1)/slides.length)+'%';$('prev').disabled=current===0;$('next').disabled=current===slides.length-1;$('back').disabled=shown===0;$('nextStep').disabled=shown===s.steps.length;$('reset').disabled=shown===0;document.querySelectorAll('.footer .btn').forEach(b=>{if(index.classList.contains('show')&&b.id!=='menu')b.disabled=true})}function move(n){if(n<0||n>=slides.length)return;current=n;shown=0;render()}$('prev').onclick=()=>move(current-1);$('next').onclick=()=>move(current+1);$('nextStep').onclick=()=>{if(shown<slides[current].steps.length){shown++;render()}};$('back').onclick=()=>{if(shown){shown--;render()}};$('reset').onclick=()=>{shown=0;render()};$('menu').onclick=()=>{index.classList.add('show');render()};$('close').onclick=()=>{index.classList.remove('show');render()};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};$('swap').onclick=()=>{let v=!$('footer').classList.contains('swapped');$('footer').classList.toggle('swapped',v);localStorage.setItem('mario-footer-swapped',v?'1':'0');$('swap').setAttribute('aria-pressed',String(v))};if(localStorage.getItem('mario-footer-swapped')==='1')$('footer').classList.add('swapped');$('indexGrid').innerHTML=slides.map((s,i)=>({s,i})).filter(x=>['portada','mapa','sesion','resumen','fin'].includes(x.s.kind)).map(({s,i})=>'<button class="indexItem" data-i="'+i+'">'+(s.kind==='sesion'?'<span class="idxCode">SESIÓN '+s.session+'</span><span class="idxTitle">'+(s.content.match(/<h2>([^<]+)<\/h2>/)||[])[1]+'</span>':'<span class="idxCode">'+(i+1)+'</span><span class="idxTitle">'+s.title+'</span>')+'</button>').join('');$('indexGrid').onclick=e=>{let b=e.target.closest('[data-i]');if(b){index.classList.remove('show');move(+b.dataset.i)}};$('jump').max=slides.length;$('go').onclick=()=>{let n=Number($('jump').value);if(!Number.isInteger(n)||n<1||n>slides.length){$('err').textContent='Número no válido';return}$('err').textContent='';index.classList.remove('show');move(n-1)};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&index.classList.contains('show')){$('close').click();return}if(index.classList.contains('show'))return;if(['ArrowRight'].includes(e.key)){e.preventDefault();$('nextStep').click()}if(e.key==='PageDown'){e.preventDefault();move(current+1)}if(e.key==='PageUp'){e.preventDefault();move(current-1)}});render();</script></body></html>
