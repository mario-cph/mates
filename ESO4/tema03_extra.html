tra","kind":"portada","session":0,"steps":[],"content":"<div class=\"hero\"><div class=\"eyebrow\">MATEMÁTICAS · 4.º ESO · OPCIÓN B</div><h1>Ejercicios extra</h1><h2>Tema 3 · Polinomios y fracciones algebraicas</h2><p>Intenta cada ejercicio, revisa la solución y corrige tus procedimientos.</p><div class=\"pill\">Ejercicios del solucionario oficial · Presentación autocontenida</div></div>"},{"title":"Bloque 1 · Valor numérico y razonamiento · Enunciados","kind":"ejercicios","session":0,"steps":[],"content":"<article class=\"card\"><h3>Ejercicio 4</h3><div>¿Cuánto tiene que valer a para que P(a)=0 si P(x)=2x²−3x+1?</div></article><article class=\"card\"><h3>Ejercicio 6</h3><div>Escribe dos polinomios de cuarto grado de los que se pueda extraer como factor común: <b>a)</b> 2xy; <b>b)</b> 3x; <b>c)</b> x³; <b>d)</b> 2xy².</div></article>"},{"title":"Bloque 1 · Valor numérico y razonamiento · Soluciones","kind":"soluciones","session":0,"steps":[],"content":"<article class=\"card\"><h3>Ejercicio 4</h3><div>2a²−3a+1=0; (2a−1)(a−1)=0. <b>a=1</b> o <b>a=1/2</b>.</div></article><article class=\"card\"><h3>Ejercicio 6</h3><div>Respuestas abiertas. Ejemplos: <b>a)</b> 2xy(x³+1), 2xy(x³−y); <b>b)</b> 3x(x³+1), 3x(2x³−1); <b>c)</b> x³(x+2), x³(2x−1); <b>d)</b> 2xy²(x³+1), 2xy²(x³−y).</div></article>"},{"title":"Bloque 2 · Factor común y expresiones · Enunciados","kind":"ejercicios","session":0,"steps":[],"content":"<article class=\"card\"><h3>Ejercicio 7</h3><div>¿Cuál es el factor común en los términos de estas expresiones? <b>a)</b> (x+1)(x−3)+(x−3)(x+2); <b>b)</b> (x−2)(x−1)+3(x−1)(x−2); <b>c)</b> 4(x+4)(x−2)+6(x−2)(x+2); <b>d)</b> (x+2)(x−1)+3(x−1).</div></article><article class=\"card\"><h3>Ejercicio 11</h3><div>Expresa como una igualdad notable: <b>a)</b> x²+6x+9; <b>b)</b> 4x²−4x+1; <b>c)</b> 9x²−16; <b>d)</b> 9x²+6x+1.</div></article>"},{"title":"Bloque 2 · Factor común y expresiones · Soluciones","kind":"soluciones","session":0,"steps":[],"content":"<article class=\"card\"><h3>Ejercicio 7</h3><div><b>a)</b> (x−3); <b>b)</b> (x−1)(x−2); <b>c)</b> 2(x−2); <b>d)</b> (x−1).</div></article><article class=\"card\"><h3>Ejercicio 11</h3><div><b>a)</b> (x+3)²; <b>b)</b> (2x−1)²; <b>c)</b> (3x−4)(3x+4); <b>d)</b> (3x+1)².</div></article>"},{"title":"Bloque 3 · División y Ruffini · Enunciados","kind":"ejercicios","session":0,"steps":[],"content":"<article class=\"card\"><h3>Ejercicio 13</h3><div>El divisor de una división de polinomios es Q(x)=2x²−7, el cociente es C(x)=x³−2x y el resto es R(x)=x−2. Calcula el dividendo.</div></article><article class=\"card\"><h3>Ejercicio 16</h3><div>Aplica la regla de Ruffini para dividir el polinomio 2x³−4x²−6x+8 entre: <b>a)</b> x+1; <b>b)</b> x−2; <b>c)</b> x−1.</div></article>"},{"title":"Bloque 3 · División y Ruffini · Soluciones","kind":"soluciones","session":0,"steps":[],"content":"<article class=\"card\"><h3>Ejercicio 13</h3><div>P(x)=Q(x)·C(x)+R(x)=(2x²−7)(x³−2x)+(x−2)=<b>2x⁵−11x³+15x−2</b>.</div></article><article class=\"card\"><h3>Ejercicio 16</h3><div><b>a)</b> C=2x²−6x, R=8. <b>b)</b> C=2x²−6, R=−4. <b>c)</b> C=2x²−2x−8, R=0.</div></article>"},{"title":"Bloque 4 · Ruffini y teorema del resto · Enunciados","kind":"ejercicios","session":0,"steps":[],"content":"<article class=\"card\"><h3>Ejercicio 18</h3><div>Calcula el valor de m para que la división (x⁵−2x³−8x²+mx+3):(x−3) sea exacta.</div></article><article class=\"card\"><h3>Ejercicio 19</h3><div>Utilizando la regla de Ruffini, halla m para que el resto de la división (7x³−5mx−2):(x+1) sea −4.</div></article><article class=\"card\"><h3>Ejercicio 20</h3><div>Calcula m para que el resto de la división (2x³−5x+7):(x−m) sea 13.</div></article>"},{"title":"Bloque 4 · Ruffini y teorema del resto · Soluciones","kind":"soluciones","session":0,"steps":[],"content":"<article class=\"card\"><h3>Ejercicio 18</h3><div>Por el teorema del resto, P(3)=0. 243−54−72+3m+3=0; 120+3m=0; <b>m=−40</b>.</div></article><article class=\"card\"><h3>Ejercicio 19</h3><div>P(−1)=−7+5m−2=5m−9. Igualamos: 5m−9=−4; <b>m=1</b>.</div></article><article class=\"card\"><h3>Ejercicio 20</h3><div>P(m)=13 → 2m³−5m+7=13 → 2m³−5m−6=0. <b>m=2</b> es solución (16−10−6=0).</div></article>"},{"title":"Bloque 5 · Teorema del resto y valor numérico · Enunciados","kind":"ejercicios","session":0,"steps":[],"content":"<article class=\"card\"><h3>Ejercicio 21</h3><div>Considerando el polinomio P(x)=x³−7x²+x−7, calcula, mediante el teorema del resto, su valor numérico para: <b>a)</b> x=1; <b>b)</b> x=5; <b>c)</b> x=−1; <b>d)</b> x=7; <b>e)</b> x=3; <b>f)</b> x=−5.</div></article>"},{"title":"Bloque 5 · Teorema del resto y valor numérico · Soluciones","kind":"soluciones","session":0,"steps":[],"content":"<article class=\"card\"><h3>Ejercicio 21</h3><div><b>a)</b> −12; <b>b)</b> −52; <b>c)</b> −16; <b>d)</b> 0; <b>e)</b> −40; <b>f)</b> −312.</div></article>"},{"title":"Bloque 6 · Factorización por factor común y Ruffini · Enunciados","kind":"ejercicios","session":0,"steps":[],"content":"<article class=\"card\"><h3>Ejercicio 37 (a–e)</h3><div>Factoriza los siguientes polinomios: <b>a)</b> x⁴−7x³−6x²+72x; <b>b)</b> x⁴−x³−25x²+25x; <b>c)</b> x⁴+x³−36x²−36x; <b>d)</b> x⁴+x³−10x²+8x; <b>e)</b> x⁴+3x³−4x.</div></article><article class=\"card\"><h3>Ejercicio 35</h3><div>Expresa el polinomio P(x)=6x²+18x+12 como producto de otros dos polinomios de dos formas diferentes.</div></article>"},{"title":"Bloque 6 · Factorización por factor común y Ruffini · Soluciones","kind":"soluciones","session":0,"steps":[],"content":"<article class=\"card\"><h3>Ejercicio 37 (a–e)</h3><div><b>a)</b> x(x−4)(x−6)(x+3).<br><b>b)</b> x(x−5)(x−1)(x+5).<br><b>c)</b> x(x−6)(x+1)(x+6).<br><b>d)</b> x(x−2)(x−1)(x+4).<br><b>e)</b> x(x−1)(x+2)².</div></article><article class=\"card\"><h3>Ejercicio 35</h3><div><b>1.ª forma:</b> (6x+6)(x+2).<br><b>2.ª forma:</b> (x+1)(6x+12).</div></article>"},{"title":"Bloque 7 · Identidades notables y factorización · Enunciados","kind":"ejercicios","session":0,"steps":[],"content":"<article class=\"card\"><h3>Ejercicio 39 (a–f)</h3><div>Aplica las igualdades notables para factorizar estos polinomios: <b>a)</b> x²+2x+1; <b>b)</b> x²+10x+25; <b>c)</b> 4x⁴−16x²+16; <b>d)</b> x²−4; <b>e)</b> 4x²−16; <b>f)</b> x³−9x²+27x−27.</div></article><article class=\"card\"><h3>Ejercicio 40 (a–d)</h3><div>Descompón factorialmente: <b>a)</b> x³+x²−6x; <b>b)</b> x⁴−x²; <b>c)</b> 2x²−3x³; <b>d)</b> 3x²+12x+12.</div></article>"},{"title":"Bloque 7 · Identidades notables y factorización · Soluciones","kind":"soluciones","session":0,"steps":[],"content":"<article class=\"card\"><h3>Ejercicio 39 (a–f)</h3><div><b>a)</b> (x+1)²; <b>b)</b> (x+5)²; <b>c)</b> (2x²−4)²; <b>d)</b> (x+2)(x−2); <b>e)</b> (2x+4)(2x−4); <b>f)</b> (x−3)³.</div></article><article class=\"card\"><h3>Ejercicio 40 (a–d)</h3><div><b>a)</b> x(x−2)(x+3); <b>b)</b> x²(x+1)(x−1); <b>c)</b> x²(2−3x); <b>d)</b> 3(x+2)².</div></article>"},{"title":"Bloque 8 · Simplificación de fracciones algebraicas · Enunciados","kind":"ejercicios","session":0,"steps":[],"content":"<article class=\"card\"><h3>Ejercicio 41 (a–d)</h3><div>Simplifica estas fracciones algebraicas: <b>a)</b> (2x−2)/(2x−6); <b>b)</b> (x²−1)/(x²−4x+3); <b>c)</b> (2x³+4x²+2x)/(6x³−6x); <b>d)</b> (x³+3x²−4)/(x²−5x+4).</div></article><article class=\"card\"><h3>Ejercicio 42 (a–c)</h3><div>Halla dos fracciones equivalentes a cada una: <b>a)</b> 2x/(3x²−x); <b>b)</b> (x⁴−1)/(x³−x); <b>c)</b> (x−1)/(x²−1).</div></article>"},{"title":"Bloque 8 · Simplificación de fracciones algebraicas · Soluciones","kind":"soluciones","session":0,"steps":[],"content":"<article class=\"card\"><h3>Ejercicio 41 (a–d)</h3><div><b>a)</b> (x−1)/(x−3), x≠3.<br><b>b)</b> (x+1)/(x−3), x≠1,3.<br><b>c)</b> (x+1)/[3(x−1)], x≠−1,0,1.<br><b>d)</b> (x+2)²/(x−4), x≠1,4.</div></article><article class=\"card\"><h3>Ejercicio 42 (a–c)</h3><div><b>a)</b> 2/(3x−1) y 6x²/(9x²−3x).<br><b>b)</b> (x²+1)/x y (x⁵−x)/(x⁴−x²).<br><b>c)</b> 1/(x+1) y (x²−x)/(x³−x).</div></article>"},{"title":"Bloque 9 · Operaciones con fracciones algebraicas · Enunciados","kind":"ejercicios","session":0,"steps":[],"content":"<article class=\"card\"><h3>Ejercicio 44 (a–d)</h3><div>Realiza las siguientes operaciones: <b>a)</b> (x−2)/(x+2)+2x/(x−2); <b>b)</b> (2x+1)/(x+1)−(x+1)/x; <b>c)</b> x/(x+2) · 3x²/(x−1); <b>d)</b> (x−1)/(x²−x−2) : (x+1)/(x²−2x).</div></article><article class=\"card\"><h3>Ejercicio 46 (a–b)</h3><div>Efectúa las operaciones: <b>a)</b> 9x/(3x−3) · (x²−1)/(3x²); <b>b)</b> (2x−6)/(x²−4) · (x²+4x+4)/(x²−6x+9).</div></article>"},{"title":"Bloque 9 · Operaciones con fracciones algebraicas · Soluciones","kind":"soluciones","session":0,"steps":[],"content":"<article class=\"card\"><h3>Ejercicio 44 (a–d)</h3><div><b>a)</b> (3x²+4)/(x²−4).<br><b>b)</b> (x²−x−1)/(x²+x).<br><b>c)</b> 3x³/[(x+2)(x−1)].<br><b>d)</b> x(x−1)/[(x+1)²].</div></article><article class=\"card\"><h3>Ejercicio 46 (a–b)</h3><div><b>a)</b> (x+1)/x.<br><b>b)</b> 2(x+2)/[(x−2)(x−3)].</div></article>"}];let current=0,shown=0;const $=id=>document.getElementById(id);const index=$('index');
function buildMathBoard(type,n){
 if(type==='board_ruffini'){
 const top=['1','−1','1','−3'];
 const mult=['','1','0','1'];
 const bottom=['1','0','1','−2'];
 let t='<div class="ruffiniBoard"><div class="ruffiniRoot">1</div><div class="ruffiniCells">';
 t+='<div class="ruffiniRow">'+top.map(v=>'<span>'+v+'</span>').join('')+'</div>';
 t+='<div class="ruffiniRow mult">'+mult.map((v,i)=>'<span>'+(n>=([99,3,3,4][i])?v:'')+'</span>').join('')+'</div>';
 t+='<div class="ruffiniRow results">'+bottom.map((v,i)=>'<span class="'+(i===3?'remainder':'')+'">'+(n>=[2,3,3,4][i]?v:'')+'</span>').join('')+'</div>';
 return t+'</div></div>'+(n===4?'<p class="boardResult">Cociente: <b>x²+1</b><br>Resto: <b>−2</b></p>':'');
 }
 const line=(t,cls='')=>'<div class="divisionLine '+cls+'">'+t+'</div>';
 return '<div class="divisionBoard"><div class="divisionDividend">'+
 line('2x³ − 3x² − 5x − 5')+
 (n>=2?line('−(2x³ − 4x² − 2x)','subtract'):'')+
 (n>=2?line('x² − 3x − 5','subtotal'):'')+
 (n>=3?line('−(x² − 2x − 1)','subtract'):'')+
 (n>=3?line('−x − 4','subtotal final'):'')+
 '</div><div class="divisionDivider"><div class="divisionDivisor">x² − 2x − 1</div><div class="divisionQuotient">'+(n>=1?'2x':'')+(n>=3?' + 1':'')+'</div></div></div>'+
 (n>=4?'<p class="boardResult">Cociente: <b>2x+1</b><br>Resto: <b>−x−4</b></p>':'');
}
function render(){let s=slides[current];$('title').textContent=s.title;$('sub').textContent=s.session?'4.º ESO · SESIÓN '+s.session:'4.º ESO · TEMA 3 · EJERCICIOS EXTRA';$('body').className='body '+(s.kind==='sesion'?'session':'');let markup=(s.kind==='sesion'||s.kind==='portada'||s.kind==='fin')?s.content:'<div class="cards">'+s.content+'</div>';if(s.kind==='ejercicios'||s.kind==='soluciones'){let count=(s.content.match(/<article class=\"card\">/g)||[]).length;markup='<div class=\"practiceGrid '+(count>=7?'dense':'')+'\">'+s.content+'</div>'}if(s.layout&&s.steps.length){markup='<div class="procedureSplit"><section class="procedureLeft"><div class="procedurePrompt">'+s.content+'</div><div class="procedureExpl"><h3>Explicación paso a paso</h3><div class="procedureSteps">'+s.steps.slice(0,shown).map((x,i)=>'<div class="procedureStep"><span class="stepNum">'+(i+1)+'</span><span>'+x+'</span></div>').join('')+'</div></div></section><section class="procedureRight"><h3>Desarrollo de la operación</h3>'+buildMathBoard(s.layout,shown)+'</section></div>'}else if(s.steps.length){markup+='<div class="steps" id="steps">'+s.steps.slice(0,shown).map((x,i)=>'<div class="step"><strong>'+String(i+1).padStart(2,'0')+'.</strong> '+x+'</div>').join('')+'</div>';}$('body').innerHTML=markup;$('counter').textContent=(current+1)+' / '+slides.length;$('progress').style.width=(100*(current+1)/slides.length)+'%';$('prev').disabled=current===0;$('next').disabled=current===slides.length-1;$('back').disabled=shown===0;$('nextStep').disabled=shown===s.steps.length;$('reset').disabled=shown===0;document.querySelectorAll('.footer .btn').forEach(b=>{if(index.classList.contains('show')&&b.id!=='menu'&&b.id!=='full')b.disabled=true})}function move(n){if(n<0||n>=slides.length)return;current=n;shown=0;render()}$('prev').onclick=()=>move(current-1);$('next').onclick=()=>move(current+1);$('nextStep').onclick=()=>{if(shown<slides[current].steps.length){shown++;render()}};$('back').onclick=()=>{if(shown){shown--;render()}};$('reset').onclick=()=>{shown=0;render()};$('menu').onclick=()=>{index.classList.add('show');render()};$('close').onclick=()=>{index.classList.remove('show');render()};$('full').addEventListener('click', function(ev){
 ev.preventDefault();ev.stopPropagation();
 const d=document, el=d.documentElement;
 const active=d.fullscreenElement||d.webkitFullscreenElement;
 try {
   const action=active?(d.exitFullscreen||d.webkitExitFullscreen):(el.requestFullscreen||el.webkitRequestFullscreen);
   if(!action){alert('Usa F11 para pantalla completa en este navegador.');return;}
   const result=action.call(active?d:el);
   if(result&&typeof result.catch==='function')result.catch(err=>{console.warn(err);alert('El navegador no permite pantalla completa aquí. Usa F11.');});
 } catch(err){console.warn(err);alert('Usa F11 para pantalla completa.');}
});
document.addEventListener('fullscreenchange',()=>{const b=$('full');b.disabled=false;b.title=document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa';b.setAttribute('aria-label',b.title)});;$('swap').onclick=()=>{const f=$('footer');const v=!f.classList.contains('swapped');f.classList.toggle('swapped',v);$('swap').setAttribute('aria-pressed',String(v));try{localStorage.setItem('mario-footer-swapped',v?'1':'0')}catch(e){}};try{if(localStorage.getItem('mario-footer-swapped')==='1')$('footer').classList.add('swapped')}catch(e){}$('swap').setAttribute('aria-pressed',String($('footer').classList.contains('swapped')));$('indexGrid').innerHTML=slides.map((s,i)=>({s,i})).filter(x=>(x.i===0 || x.s.kind==='ejercicios')).map(({s,i})=>'<button class="indexItem" data-i="'+i+'">'+(s.kind==='sesion'?'<span class="indexSessionLabel">SESIÓN '+s.session+'</span><span class="indexSessionTitle">'+s.title.replace(/^Sesión \d+ · /,'')+'</span>':/^Bloque \d+ · /.test(s.title)?'<span class="indexSessionLabel">'+s.title.split(' · ')[0].toUpperCase()+'</span><span class="indexSessionTitle">'+s.title.replace(/^Bloque \d+ · /,'').replace(/ · Enunciados$/,'')+'</span>':'<span class="indexOtherLabel">'+s.title+'</span>')+'</button>').join('');$('indexGrid').onclick=e=>{let b=e.target.closest('[data-i]');if(b){index.classList.remove('show');move(+b.dataset.i)}};$('jump').max=slides.length;$('go').onclick=()=>{let n=Number($('jump').value);if(!Number.isInteger(n)||n<1||n>slides.length){$('err').textContent='Número no válido';return}$('err').textContent='';index.classList.remove('show');move(n-1)};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&index.classList.contains('show')){$('close').click();return}if(index.classList.contains('show'))return;if(['ArrowRight'].includes(e.key)){e.preventDefault();$('nextStep').click()}if(e.key==='PageDown'){e.preventDefault();move(current+1)}if(e.key==='PageUp'){e.preventDefault();move(current-1)}});render();

</script></body></html>
