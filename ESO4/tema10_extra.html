<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tema en construcción</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.18), transparent 30%), linear-gradient(135deg, #173b63 0%, #245b8f 55%, #2c79ad 100%);
      color: white; overflow: hidden;
    }
    .screen { width: 100%; height: 100%; min-height: 520px; display: flex; align-items: center; justify-content: center; padding: 32px; }
    .card { width: min(900px, 94vw); background: rgba(255,255,255,0.97); color: #173b63; border-radius: 24px; padding: 48px 42px; text-align: center; box-shadow: 0 18px 50px rgba(0,0,0,0.22); border: 3px solid rgba(255,255,255,0.55); }
    .icon { width: 112px; height: 112px; margin: 0 auto 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #f3b33d; font-size: 56px; box-shadow: 0 8px 22px rgba(243,179,61,0.35); }
    h1 { margin: 0 0 14px; font-size: clamp(34px, 5vw, 58px); line-height: 1.05; }
    .subtitle { margin: 0 auto; max-width: 650px; font-size: clamp(18px, 2.3vw, 26px); line-height: 1.4; color: #45637f; }
    .status { margin-top: 30px; display: inline-block; padding: 12px 20px; border-radius: 999px; background: #fff4cf; color: #8a6411; font-weight: 700; font-size: 18px; border: 1px solid #f0d37c; }
    .footer { margin-top: 28px; font-size: 15px; color: #6c8295; }
    @media (max-width: 600px) { .screen { padding: 18px; } .card { padding: 34px 22px; } .icon { width: 90px; height: 90px; font-size: 44px; } }
  </style>
</head>
<body>
  <main class="screen">
    <section class="card">
      <div class="icon">🚧</div>
      <h1>Tema en construcción</h1>
      <p class="subtitle">Este contenido todavía no está disponible. Estamos preparando el tema para que puedas consultarlo próximamente.</p>
      <div class="status">Próximamente</div>
      <div class="footer">Matemáticas · Material del curso</div>
    </section>
  </main>
</body>
</html>
